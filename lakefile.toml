name = "hyperreals-formalization"
version = "0.1.0"
defaultTargets = ["Hyperreals", "periodic_checker", "laurent_checker"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Hyperreals"

[[lean_exe]]
name = "periodic_checker"
root = "PeriodicChecker"

[[lean_exe]]
name = "laurent_checker"
root = "LaurentChecker"

